name: Update GitHub Actions

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          CHANGES=false
          BRANCH="automation/update-github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ACTIONS=$(
            find .github/actions -name "action.yml" -print0 |
            xargs -0 grep -hE '^[[:space:]]*uses:' |
            sed -E 's/^[[:space:]]*uses:[[:space:]]*//' |
            tr -d '"' |
            tr -d "'" |
            grep -vE '^(\./|docker://)' |
            sort -u
          )

          echo "========================================================"
          echo "Actions found"
          echo "========================================================"
          echo "$ACTIONS"
          echo

          while read -r ACTION; do
            [ -z "$ACTION" ] && continue

            REPO="${ACTION%@*}"
            CURRENT_REF="${ACTION#*@}"

            ########################################################
            # Current SHA
            ########################################################
            CURRENT_SHA=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${CURRENT_REF}" \
              | jq -r '.sha')

            ########################################################
            # Latest Release (fallback -> Tags)
            ########################################################
            HTTP_CODE=$(curl \
              -s \
              -o latest.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/latest")

            if [[ "$HTTP_CODE" == "200" ]]; then
              LATEST_REF=$(jq -r '.tag_name' latest.json)

            elif [[ "$HTTP_CODE" == "404" ]]; then
              echo "No releases found. Using latest tag."

              LATEST_REF=$(curl -fsSL \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/tags" \
                | jq -r '.[0].name')

            else
              echo "Unable to query ${REPO}"
              continue
            fi

            ########################################################
            # Latest SHA
            ########################################################
            LATEST_SHA=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${LATEST_REF}" \
              | jq -r '.sha')

            echo "--------------------------------------------------------"
            echo "Repository : $REPO"
            echo "Current Ref: $CURRENT_REF"
            echo "Current SHA: $CURRENT_SHA"
            echo "Latest Ref : $LATEST_REF"
            echo "Latest SHA : $LATEST_SHA"

            ########################################################
            # Update files
            ########################################################
            if [[ "$CURRENT_SHA" != "$LATEST_SHA" ]]; then

              echo "Updating ${ACTION} -> ${REPO}@${LATEST_REF}"

              while IFS= read -r FILE; do
                sed -i \
                  "s|${ACTION}|${REPO}@${LATEST_REF}|g" \
                  "$FILE"

                echo "Updated $FILE"
              done < <(grep -rl --include="action.yml" "$ACTION" .github/actions)

              CHANGES=true
            else
              echo "Already up-to-date."
            fi

            echo

          done <<< "$ACTIONS"

          if [[ "$CHANGES" == "true" ]]; then
            git checkout -b "$BRANCH"

            git add .github/actions

            git commit -m "chore: update GitHub Actions"

            git push origin "$BRANCH"

            echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
            echo "CHANGES=true" >> "$GITHUB_ENV"
          else
            echo "CHANGES=false" >> "$GITHUB_ENV"
          fi

      - name: Create Pull Request
        if: env.CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore: update GitHub Actions" \
            --body "Automatically updates GitHub Actions to their latest released versions."

      - name: No updates found
        if: env.CHANGES != 'true'
        run: |
          echo "All GitHub Actions are already up-to-date."
